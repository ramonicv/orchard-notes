# Every push to a branch: unit tests and the release APK, signed with a throwaway key so the
# signing setup is exercised before it matters.
# Every v1.2.3 tag: the same build signed with the project's release key, published as a
# GitHub Release with the APK attached. See docs/releasing.md.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # creating the release on tags

concurrency:
  group: build-${{ github.ref }}
  # A newer push to the same branch supersedes a running build; a release always finishes.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Version and signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
              echo "::error::Release tags look like v1.2.3, not $GITHUB_REF_NAME"
              exit 1
            fi
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::The release key secrets aren't set up (docs/releasing.md); not publishing an APK signed with anything else"
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "ORG_GRADLE_PROJECT_orchardVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            KEYSTORE_PASSWORD=throwaway KEY_ALIAS=ci KEY_PASSWORD=throwaway
            keytool -genkeypair -keystore "$keystore" -alias ci -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=Orchard Notes CI" -storepass throwaway -keypass throwaway
          fi
          {
            echo "ORG_GRADLE_PROJECT_orchardKeystoreFile=$keystore"
            echo "ORG_GRADLE_PROJECT_orchardKeystorePassword=$KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_orchardKeyAlias=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_orchardKeyPassword=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Release APK
        run: ./gradlew assembleRelease

      - name: Check the APK is signed with that key
        id: signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          signed=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          expected=$(keytool -exportcert -keystore "$ORG_GRADLE_PROJECT_orchardKeystoreFile" \
            -storepass:env ORG_GRADLE_PROJECT_orchardKeystorePassword -alias "$ORG_GRADLE_PROJECT_orchardKeyAlias" \
            | sha256sum | cut -d' ' -f1)
          if [ -z "$signed" ] || [ "$signed" != "$expected" ]; then
            echo "::error::The APK isn't signed with the release key (signed by '$signed', expected '$expected')"
            exit 1
          fi
          echo "certificate=$signed" >> "$GITHUB_OUTPUT"

      # Room exports the database schema on every build; migrations are checked against these files.
      - name: Check Room schemas are committed
        if: github.ref_type == 'branch'
        run: |
          git add --intent-to-add app/schemas
          if ! git diff --exit-code app/schemas; then
            echo "::error::The database schema changed: commit the app/schemas files a local build generates"
            exit 1
          fi

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATE: ${{ steps.signature.outputs.certificate }}
        run: |
          apk="orchard-notes-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          {
            echo "### Install"
            echo
            echo "On your Android phone (8.0 or newer), download **$apk** below and open it. Android asks you to allow installs from your browser the first time. To update, install the newer APK over the old one: your sign-in and notes are kept."
            echo
            # shellcheck disable=SC2016 # literal backticks: Markdown code
            printf 'APK SHA-256: `%s`  \nSigning certificate SHA-256: `%s`\n' "$(sha256sum "$apk" | cut -d' ' -f1)" "$CERTIFICATE"
            echo
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --title "Orchard Notes ${GITHUB_REF_NAME#v}" \
            --notes "$(cat notes.md)" --generate-notes
